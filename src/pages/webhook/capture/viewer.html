<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webhook Capture Viewer</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background: #0f172a;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #1e293b;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .header-actions {
            display: flex;
            gap: 0.75rem;
        }
        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 0.375rem;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        .btn-primary:hover {
            background: #2563eb;
        }
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn-secondary {
            background: #475569;
            color: white;
        }
        .btn-secondary:hover {
            background: #334155;
        }
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .sidebar {
            width: 350px;
            background: #1e293b;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sidebar-header {
            padding: 1rem;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar-header h2 {
            margin: 0;
            font-size: 1rem;
            color: #cbd5e1;
        }
        .webhook-count {
            background: #475569;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .webhook-list {
            flex: 1;
            overflow-y: auto;
        }
        .webhook-item {
            padding: 1rem;
            border-bottom: 1px solid #334155;
            cursor: pointer;
            transition: background 0.2s;
        }
        .webhook-item:hover {
            background: #334155;
        }
        .webhook-item.active {
            background: #334155;
            border-left: 3px solid #3b82f6;
        }
        .webhook-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .webhook-method {
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .method-post {
            background: #10b981;
            color: white;
        }
        .method-put {
            background: #f59e0b;
            color: white;
        }
        .method-get {
            background: #3b82f6;
            color: white;
        }
        .method-delete {
            background: #ef4444;
            color: white;
        }
        .method-patch {
            background: #8b5cf6;
            color: white;
        }
        .webhook-time {
            font-size: 0.75rem;
            color: #94a3b8;
        }
        .webhook-url {
            font-size: 0.875rem;
            color: #cbd5e1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-bottom: 0.25rem;
        }
        .webhook-type {
            font-size: 0.75rem;
            color: #94a3b8;
        }
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #64748b;
            text-align: center;
        }
        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        .detail-section {
            background: #1e293b;
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid #334155;
        }
        .detail-section h3 {
            margin: 0 0 1rem 0;
            font-size: 1rem;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .section-actions {
            display: flex;
            gap: 0.5rem;
        }
        .detail-grid {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 0.75rem;
            font-size: 0.875rem;
        }
        .detail-label {
            color: #94a3b8;
            font-weight: 600;
        }
        .detail-value {
            color: #e2e8f0;
            word-break: break-all;
        }
        .json-viewer {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 0.375rem;
            padding: 1rem;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
            line-height: 1.6;
        }
        .json-line {
            display: flex;
            align-items: flex-start;
            padding: 2px 0;
        }
        .json-key {
            color: #60a5fa;
            margin-right: 0.5rem;
        }
        .json-string {
            color: #34d399;
        }
        .json-number {
            color: #fbbf24;
        }
        .json-boolean {
            color: #f472b6;
        }
        .json-null {
            color: #94a3b8;
        }
        .json-toggle {
            cursor: pointer;
            user-select: none;
            color: #94a3b8;
            margin-right: 0.25rem;
            display: inline-block;
            width: 1rem;
            text-align: center;
            font-weight: bold;
        }
        .json-toggle:hover {
            color: #cbd5e1;
        }
        .json-collapsed {
            color: #64748b;
            font-style: italic;
        }
        .json-bracket {
            color: #cbd5e1;
        }
        .json-nested {
            margin-left: 1.5rem;
        }
        .copy-btn {
            padding: 0.375rem 0.75rem;
            background: #334155;
            border: none;
            border-radius: 0.25rem;
            color: #cbd5e1;
            cursor: pointer;
            font-size: 0.75rem;
            transition: background 0.2s;
        }
        .copy-btn:hover {
            background: #475569;
        }
        .copy-btn.copied {
            background: #10b981;
            color: white;
        }
        .expand-collapse-btns {
            display: flex;
            gap: 0.5rem;
        }
        .loading {
            text-align: center;
            padding: 2rem;
            color: #64748b;
        }
        .delete-btn {
            padding: 0.25rem 0.5rem;
            background: #ef4444;
            border: none;
            border-radius: 0.25rem;
            color: white;
            cursor: pointer;
            font-size: 0.75rem;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .webhook-item:hover .delete-btn {
            opacity: 1;
        }
        .delete-btn:hover {
            background: #dc2626;
        }
        .endpoint-info {
            background: #1e293b;
            border: 1px solid #3b82f6;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }
        .endpoint-info h3 {
            margin: 0 0 0.5rem 0;
            font-size: 0.875rem;
            color: #60a5fa;
            font-weight: 600;
        }
        .endpoint-url {
            font-family: monospace;
            color: #e2e8f0;
            background: #0f172a;
            padding: 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Webhook Capture Viewer
        </h1>
        <div class="header-actions">
            <button class="btn btn-secondary" onclick="refreshWebhooks()" title="Refresh webhook list (preserves expanded state)">
                Refresh
            </button>
            <button class="btn btn-danger" onclick="clearAllWebhooks()">
                Clear All
            </button>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Captured Webhooks</h2>
                <span class="webhook-count" id="webhookCount">0</span>
            </div>
            <div class="webhook-list" id="webhookList">
                <div class="loading">Loading webhooks...</div>
            </div>
        </div>

        <div class="main-content" id="mainContent">
            <div class="endpoint-info">
                <h3>📍 Webhook Endpoint URL</h3>
                <div class="endpoint-url">
                    <code id="endpointUrl">Loading...</code>
                    <button class="btn btn-primary" style="padding: 0.25rem 0.75rem; font-size: 0.75rem;" onclick="copyEndpoint()">
                        Copy
                    </button>
                </div>
            </div>

            <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                <h2>No Webhooks Captured Yet</h2>
                <p>Send a webhook to the endpoint above to start capturing</p>
            </div>
        </div>
    </div>

    <script>
        let webhooks = [];
        let selectedWebhookId = null;

        // Set endpoint URL
        document.getElementById('endpointUrl').textContent = `${window.location.origin}/webhook/capture`;

        // Load webhooks on page load
        loadWebhooks();

        // Auto-refresh every 10 seconds (only updates list, preserves detail view state)
        setInterval(loadWebhooks, 10000);

        async function loadWebhooks() {
            try {
                const response = await fetch('/webhook/capture');
                const data = await response.json();

                if (data.success) {
                    webhooks = data.webhooks;
                    renderWebhookList();
                    document.getElementById('webhookCount').textContent = webhooks.length;

                    // Don't re-render webhook details on auto-refresh
                    // This preserves the expand/collapse state
                    // Details will only re-render when explicitly selected
                }
            } catch (error) {
                console.error('Failed to load webhooks:', error);
            }
        }

        function renderWebhookList() {
            const listEl = document.getElementById('webhookList');

            if (webhooks.length === 0) {
                listEl.innerHTML = '<div class="loading">No webhooks captured yet</div>';
                return;
            }

            listEl.innerHTML = webhooks.map(webhook => `
                <div class="webhook-item ${webhook.id === selectedWebhookId ? 'active' : ''}"
                     onclick="selectWebhook('${webhook.id}')">
                    <div class="webhook-item-header">
                        <span class="webhook-method method-${webhook.method.toLowerCase()}">
                            ${webhook.method}
                        </span>
                        <span class="webhook-time">${formatTime(webhook.timestamp)}</span>
                    </div>
                    <div class="webhook-url" title="${webhook.url}">${webhook.url}</div>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div class="webhook-type">${webhook.contentType || 'No content type'}</div>
                        <button class="delete-btn" onclick="event.stopPropagation(); deleteWebhook('${webhook.id}')">
                            Delete
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function selectWebhook(id) {
            selectedWebhookId = id;
            const webhook = webhooks.find(w => w.id === id);
            if (webhook) {
                renderWebhookDetails(webhook);
                renderWebhookList(); // Update active state
            }
        }

        function renderWebhookDetails(webhook) {
            const mainContent = document.getElementById('mainContent');

            mainContent.innerHTML = `
                <div class="endpoint-info">
                    <h3>📍 Webhook Endpoint URL</h3>
                    <div class="endpoint-url">
                        <code>${window.location.origin}/webhook/capture</code>
                        <button class="btn btn-primary" style="padding: 0.25rem 0.75rem; font-size: 0.75rem;" onclick="copyEndpoint()">
                            Copy
                        </button>
                    </div>
                </div>

                <div class="detail-section">
                    <h3>
                        <span>📋 Request Details</span>
                        <button class="copy-btn" onclick="reloadWebhookDetails('${webhook.id}')" title="Reload this webhook's details">
                            Reload
                        </button>
                    </h3>
                    <div class="detail-grid">
                        <div class="detail-label">Webhook ID:</div>
                        <div class="detail-value">${webhook.id}</div>

                        <div class="detail-label">Method:</div>
                        <div class="detail-value"><span class="webhook-method method-${webhook.method.toLowerCase()}">${webhook.method}</span></div>

                        <div class="detail-label">URL:</div>
                        <div class="detail-value">${webhook.url}</div>

                        <div class="detail-label">Timestamp:</div>
                        <div class="detail-value">${new Date(webhook.timestamp).toLocaleString()}</div>

                        <div class="detail-label">Content Type:</div>
                        <div class="detail-value">${webhook.contentType || 'Not specified'}</div>

                        <div class="detail-label">User Agent:</div>
                        <div class="detail-value">${webhook.userAgent || 'Not specified'}</div>
                    </div>
                </div>

                ${Object.keys(webhook.query).length > 0 ? `
                <div class="detail-section">
                    <h3>
                        <span>🔍 Query Parameters</span>
                        <div class="section-actions">
                            <button class="copy-btn" onclick="copyJsonToClipboard('query-${webhook.id}')">Copy JSON</button>
                        </div>
                    </h3>
                    <div class="json-viewer" id="query-${webhook.id}"></div>
                </div>
                ` : ''}

                <div class="detail-section">
                    <h3>
                        <span>📤 Headers</span>
                        <div class="section-actions">
                            <div class="expand-collapse-btns">
                                <button class="copy-btn" onclick="expandAllInSection('headers-${webhook.id}')">Expand All</button>
                                <button class="copy-btn" onclick="collapseAllInSection('headers-${webhook.id}')">Collapse All</button>
                            </div>
                            <button class="copy-btn" onclick="copyJsonToClipboard('headers-${webhook.id}')">Copy JSON</button>
                        </div>
                    </h3>
                    <div class="json-viewer" id="headers-${webhook.id}"></div>
                </div>

                <div class="detail-section">
                    <h3>
                        <span>📦 Body (Parsed)</span>
                        <div class="section-actions">
                            <div class="expand-collapse-btns">
                                <button class="copy-btn" onclick="expandAllInSection('body-${webhook.id}')">Expand All</button>
                                <button class="copy-btn" onclick="collapseAllInSection('body-${webhook.id}')">Collapse All</button>
                            </div>
                            <button class="copy-btn" onclick="copyJsonToClipboard('body-${webhook.id}')">Copy JSON</button>
                        </div>
                    </h3>
                    <div class="json-viewer" id="body-${webhook.id}"></div>
                </div>

                <div class="detail-section">
                    <h3>
                        <span>📄 Raw Body</span>
                        <div class="section-actions">
                            <button class="copy-btn" onclick="copyRawText('raw-${webhook.id}')">Copy</button>
                        </div>
                    </h3>
                    <div class="json-viewer">
                        <pre id="raw-${webhook.id}" style="margin: 0; color: #e2e8f0; white-space: pre-wrap; word-break: break-all;">${webhook.rawBody || '(empty)'}</pre>
                    </div>
                </div>
            `;

            // Render JSON viewers
            if (Object.keys(webhook.query).length > 0) {
                renderJsonTree(webhook.query, `query-${webhook.id}`);
            }
            renderJsonTree(webhook.headers, `headers-${webhook.id}`);
            renderJsonTree(webhook.body, `body-${webhook.id}`);
        }

        // JSON Tree Renderer
        function renderJsonTree(data, containerId, initiallyExpanded = true) {
            const container = document.getElementById(containerId);
            if (!container) return;

            container.innerHTML = '';
            container.setAttribute('data-json', JSON.stringify(data));

            const tree = createJsonElement(data, 0, initiallyExpanded);
            container.appendChild(tree);
        }

        function createJsonElement(value, depth = 0, expanded = true) {
            const element = document.createElement('div');

            if (value === null) {
                element.innerHTML = `<span class="json-null">null</span>`;
                return element;
            }

            const type = typeof value;

            if (type === 'string') {
                element.innerHTML = `<span class="json-string">"${escapeHtml(value)}"</span>`;
            } else if (type === 'number') {
                element.innerHTML = `<span class="json-number">${value}</span>`;
            } else if (type === 'boolean') {
                element.innerHTML = `<span class="json-boolean">${value}</span>`;
            } else if (Array.isArray(value)) {
                element.appendChild(createArrayElement(value, depth, expanded));
            } else if (type === 'object') {
                element.appendChild(createObjectElement(value, depth, expanded));
            }

            return element;
        }

        function createObjectElement(obj, depth, expanded) {
            const container = document.createElement('div');
            const keys = Object.keys(obj);

            if (keys.length === 0) {
                container.innerHTML = `<span class="json-bracket">{}</span>`;
                return container;
            }

            const toggleId = `toggle-${Math.random().toString(36).substr(2, 9)}`;
            const contentId = `content-${Math.random().toString(36).substr(2, 9)}`;

            const header = document.createElement('div');
            header.innerHTML = `
                <span class="json-toggle" id="${toggleId}">${expanded ? '▼' : '▶'}</span>
                <span class="json-bracket">{</span>
                <span class="json-collapsed" id="${contentId}-summary" style="display: ${expanded ? 'none' : 'inline'}"> ... } <span style="color: #64748b;">(${keys.length} ${keys.length === 1 ? 'property' : 'properties'})</span></span>
            `;

            const content = document.createElement('div');
            content.className = 'json-nested';
            content.id = contentId;
            content.style.display = expanded ? 'block' : 'none';

            keys.forEach((key, index) => {
                const line = document.createElement('div');
                line.className = 'json-line';

                const keySpan = document.createElement('span');
                keySpan.className = 'json-key';
                keySpan.textContent = `"${key}": `;
                line.appendChild(keySpan);

                const valueElement = createJsonElement(obj[key], depth + 1, false);
                line.appendChild(valueElement);

                if (index < keys.length - 1) {
                    line.appendChild(document.createTextNode(','));
                }

                content.appendChild(line);
            });

            const footer = document.createElement('div');
            footer.innerHTML = `<span class="json-bracket">}</span>`;
            footer.style.display = expanded ? 'block' : 'none';
            footer.id = `${contentId}-footer`;

            header.querySelector('.json-toggle').addEventListener('click', () => {
                const isExpanded = content.style.display === 'block';
                content.style.display = isExpanded ? 'none' : 'block';
                footer.style.display = isExpanded ? 'none' : 'block';
                document.getElementById(`${contentId}-summary`).style.display = isExpanded ? 'inline' : 'none';
                document.getElementById(toggleId).textContent = isExpanded ? '▶' : '▼';
            });

            container.appendChild(header);
            container.appendChild(content);
            container.appendChild(footer);

            return container;
        }

        function createArrayElement(arr, depth, expanded) {
            const container = document.createElement('div');

            if (arr.length === 0) {
                container.innerHTML = `<span class="json-bracket">[]</span>`;
                return container;
            }

            const toggleId = `toggle-${Math.random().toString(36).substr(2, 9)}`;
            const contentId = `content-${Math.random().toString(36).substr(2, 9)}`;

            const header = document.createElement('div');
            header.innerHTML = `
                <span class="json-toggle" id="${toggleId}">${expanded ? '▼' : '▶'}</span>
                <span class="json-bracket">[</span>
                <span class="json-collapsed" id="${contentId}-summary" style="display: ${expanded ? 'none' : 'inline'}"> ... ] <span style="color: #64748b;">(${arr.length} ${arr.length === 1 ? 'item' : 'items'})</span></span>
            `;

            const content = document.createElement('div');
            content.className = 'json-nested';
            content.id = contentId;
            content.style.display = expanded ? 'block' : 'none';

            arr.forEach((item, index) => {
                const line = document.createElement('div');
                line.className = 'json-line';

                const valueElement = createJsonElement(item, depth + 1, false);
                line.appendChild(valueElement);

                if (index < arr.length - 1) {
                    line.appendChild(document.createTextNode(','));
                }

                content.appendChild(line);
            });

            const footer = document.createElement('div');
            footer.innerHTML = `<span class="json-bracket">]</span>`;
            footer.style.display = expanded ? 'block' : 'none';
            footer.id = `${contentId}-footer`;

            header.querySelector('.json-toggle').addEventListener('click', () => {
                const isExpanded = content.style.display === 'block';
                content.style.display = isExpanded ? 'none' : 'block';
                footer.style.display = isExpanded ? 'none' : 'block';
                document.getElementById(`${contentId}-summary`).style.display = isExpanded ? 'inline' : 'none';
                document.getElementById(toggleId).textContent = isExpanded ? '▶' : '▼';
            });

            container.appendChild(header);
            container.appendChild(content);
            container.appendChild(footer);

            return container;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function expandAllInSection(sectionId) {
            const section = document.getElementById(sectionId);
            if (!section) return;

            section.querySelectorAll('.json-toggle').forEach(toggle => {
                const content = toggle.parentElement.nextElementSibling;
                const footer = content?.nextElementSibling;
                const summary = toggle.parentElement.querySelector('.json-collapsed');

                if (content && content.style.display === 'none') {
                    toggle.textContent = '▼';
                    content.style.display = 'block';
                    if (footer) footer.style.display = 'block';
                    if (summary) summary.style.display = 'none';
                }
            });
        }

        function collapseAllInSection(sectionId) {
            const section = document.getElementById(sectionId);
            if (!section) return;

            section.querySelectorAll('.json-toggle').forEach(toggle => {
                const content = toggle.parentElement.nextElementSibling;
                const footer = content?.nextElementSibling;
                const summary = toggle.parentElement.querySelector('.json-collapsed');

                if (content && content.style.display === 'block') {
                    toggle.textContent = '▶';
                    content.style.display = 'none';
                    if (footer) footer.style.display = 'none';
                    if (summary) summary.style.display = 'inline';
                }
            });
        }

        async function copyJsonToClipboard(sectionId) {
            const section = document.getElementById(sectionId);
            if (!section) return;

            const jsonData = section.getAttribute('data-json');
            if (!jsonData) return;

            try {
                const formatted = JSON.stringify(JSON.parse(jsonData), null, 2);
                await navigator.clipboard.writeText(formatted);

                // Find the copy button and show feedback
                const copyBtn = event.target;
                const originalText = copyBtn.textContent;
                copyBtn.textContent = 'Copied!';
                copyBtn.classList.add('copied');
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                    copyBtn.classList.remove('copied');
                }, 2000);
            } catch (error) {
                console.error('Failed to copy:', error);
            }
        }

        async function copyRawText(elementId) {
            const element = document.getElementById(elementId);
            if (!element) return;

            try {
                await navigator.clipboard.writeText(element.textContent);

                const copyBtn = event.target;
                const originalText = copyBtn.textContent;
                copyBtn.textContent = 'Copied!';
                copyBtn.classList.add('copied');
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                    copyBtn.classList.remove('copied');
                }, 2000);
            } catch (error) {
                console.error('Failed to copy:', error);
            }
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;

            if (diff < 60000) {
                return 'Just now';
            } else if (diff < 3600000) {
                return `${Math.floor(diff / 60000)}m ago`;
            } else if (diff < 86400000) {
                return `${Math.floor(diff / 3600000)}h ago`;
            } else {
                return date.toLocaleDateString();
            }
        }

        async function copyEndpoint() {
            const url = `${window.location.origin}/webhook/capture`;
            try {
                await navigator.clipboard.writeText(url);
                alert('Endpoint URL copied to clipboard!');
            } catch (error) {
                console.error('Failed to copy:', error);
            }
        }

        async function refreshWebhooks() {
            const btn = event?.target;
            const originalText = btn?.textContent;

            if (btn) {
                btn.textContent = 'Refreshing...';
                btn.disabled = true;
            }

            await loadWebhooks();

            if (btn) {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        async function reloadWebhookDetails(webhookId) {
            const btn = event?.target;
            const originalText = btn?.textContent;

            if (btn) {
                btn.textContent = 'Reloading...';
                btn.disabled = true;
            }

            // Fetch fresh data
            await loadWebhooks();

            // Re-render the webhook details
            const webhook = webhooks.find(w => w.id === webhookId);
            if (webhook) {
                renderWebhookDetails(webhook);
            }

            // Note: Button state will be reset by re-render, so no need to restore
        }

        async function clearAllWebhooks() {
            if (!confirm('Are you sure you want to clear all captured webhooks?')) {
                return;
            }

            try {
                const response = await fetch('/webhook/capture', {
                    method: 'DELETE'
                });

                if (response.ok) {
                    webhooks = [];
                    selectedWebhookId = null;
                    renderWebhookList();
                    document.getElementById('webhookCount').textContent = '0';
                    document.getElementById('mainContent').innerHTML = `
                        <div class="endpoint-info">
                            <h3>📍 Webhook Endpoint URL</h3>
                            <div class="endpoint-url">
                                <code>${window.location.origin}/webhook/capture</code>
                                <button class="btn btn-primary" style="padding: 0.25rem 0.75rem; font-size: 0.75rem;" onclick="copyEndpoint()">
                                    Copy
                                </button>
                            </div>
                        </div>
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="7 10 12 15 17 10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                            </svg>
                            <h2>All Webhooks Cleared</h2>
                            <p>Send a webhook to the endpoint above to start capturing</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Failed to clear webhooks:', error);
                alert('Failed to clear webhooks');
            }
        }

        async function deleteWebhook(id) {
            try {
                const response = await fetch(`/webhook/capture?id=${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    if (selectedWebhookId === id) {
                        selectedWebhookId = null;
                        document.getElementById('mainContent').innerHTML = `
                            <div class="endpoint-info">
                                <h3>📍 Webhook Endpoint URL</h3>
                                <div class="endpoint-url">
                                    <code>${window.location.origin}/webhook/capture</code>
                                    <button class="btn btn-primary" style="padding: 0.25rem 0.75rem; font-size: 0.75rem;" onclick="copyEndpoint()">
                                        Copy
                                    </button>
                                </div>
                            </div>
                            <div class="empty-state">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="7 10 12 15 17 10"></polyline>
                                    <line x1="12" y1="15" x2="12" y2="3"></line>
                                </svg>
                                <h2>Select a Webhook</h2>
                                <p>Click on a webhook in the sidebar to view details</p>
                            </div>
                        `;
                    }
                    await loadWebhooks();
                }
            } catch (error) {
                console.error('Failed to delete webhook:', error);
                alert('Failed to delete webhook');
            }
        }
    </script>
